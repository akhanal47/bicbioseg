[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bicbioseg"
version = "0.1.0"
description = "User-friendly biomedical image segmentation utilities and training wrappers."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "bicbioseg contributors" }
]
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "pillow",
    "scikit-learn",
    "scipy",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dicom = ["pydicom"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

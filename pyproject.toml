[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bicbioseg"
version = "0.1.0"
description = "User-friendly biomedical image segmentation utilities and training wrappers."
keywords = ["biomedical", "segmentation", "pytorch", "microscopy", "medical-imaging"]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Anup Khanal" }
]
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "pillow",
    "scikit-learn",
    "scipy",
    "torch",
    "torchvision",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/akhanal47/bicbioseg"
Repository = "https://github.com/akhanal47/bicbioseg"
Issues = "https://github.com/akhanal47/bicbioseg/issues"

[project.optional-dependencies]
dicom = ["pydicom"]
dev = ["pytest"]
albumentations = ["albumentations"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
